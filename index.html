<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxia 3D</title>
    <style>
        /* Elimina los bordes y hace que la animación ocupe toda la pantalla */
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #000; 
        }
        canvas { 
            display: block; 
        }
    </style>
</head>
<body>
    <!-- El lienzo donde Three.js dibujará la galaxia -->
    <canvas class="webgl"></canvas>
    
    <!-- Conexión con tu archivo de JavaScript -->
    <script type="module" src="/app.js"></script>
</body>
</html>
