<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxia 3D</title>
    <style>
        /* Hace que la animación ocupe toda la pantalla de fondo sin bordes */
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #000; 
        }
        canvas { 
            display: block; 
        }
    </style>
    <!-- Servidores estables de cdnjs para cargar el motor 3D sin bloqueos de red -->
    <script src="https://cloudflare.com"></script>
    <script src="https://cloudflare.com"></script>
</head>
<body>
    <!-- El lienzo WebGL donde Three.js dibujará las estrellas -->
    <canvas class="webgl"></canvas>
    
    <!-- El truco del ?v=2 rompe la caché vieja del navegador y fuerza el código nuevo -->
    <script src="app.js?v=2"></script>
</body>
</html>
